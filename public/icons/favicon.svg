<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icono del sudoku: rejilla 3×3 con la diagonal en color acento.
       Fuentes SVG en public/icons/ — los PNG se generan con `npm.cmd run iconos`. -->
  <rect width="512" height="512" rx="104" fill="#faf9f7"/>
  <g>
    <rect x="60" y="60" width="124" height="124" rx="18" fill="#457b9d"/>
    <rect x="194" y="60" width="124" height="124" rx="18" fill="#1a1a1a"/>
    <rect x="328" y="60" width="124" height="124" rx="18" fill="#1a1a1a"/>
    <rect x="60" y="194" width="124" height="124" rx="18" fill="#1a1a1a"/>
    <rect x="194" y="194" width="124" height="124" rx="18" fill="#457b9d"/>
    <rect x="328" y="194" width="124" height="124" rx="18" fill="#1a1a1a"/>
    <rect x="60" y="328" width="124" height="124" rx="18" fill="#1a1a1a"/>
    <rect x="194" y="328" width="124" height="124" rx="18" fill="#1a1a1a"/>
    <rect x="328" y="328" width="124" height="124" rx="18" fill="#457b9d"/>
  </g>
</svg>
