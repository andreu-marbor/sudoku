# CI en pull requests (en `main` ya despliega despliegue.yml con pruebas + build)
name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas (generador + partida + i18n)
        run: npm run prueba

      - name: Build de producción
        run: npm run build
